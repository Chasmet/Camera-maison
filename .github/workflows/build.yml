name: CHK Cameras — Build, Release signée et mises à jour

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: chk-cameras-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34 via le runner préinstallé
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          (yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null) || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Générer le wrapper officiel
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Compiler Debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PgithubRepository="$GITHUB_REPOSITORY"
      - name: Obtenir la signature permanente via CHK Serveur PC Universel (OIDC)
        run: python3 signing/prepare_ci.py
      - name: Compiler la véritable APK Release signée
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER" \
            -PgithubRepository="$GITHUB_REPOSITORY"
          cp app/build/outputs/apk/release/app-release.apk chk-cameras-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs chk-cameras-release.apk
          sha256sum chk-cameras-release.apk > chk-cameras-release.apk.sha256
          echo "### ✅ APK officielle signée v$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Vérifier la continuité du certificat par rapport à la précédente version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          NEW_CERT="$("$SIGNER" verify --print-certs chk-cameras-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$NEW_CERT"
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/previous-release"
            gh release download --repo "$GITHUB_REPOSITORY" -p chk-cameras-release.apk -D "$RUNNER_TEMP/previous-release"
            OLD_CERT="$("$SIGNER" verify --print-certs "$RUNNER_TEMP/previous-release/chk-cameras-release.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test -n "$OLD_CERT"
            test "$NEW_CERT" = "$OLD_CERT" || { echo 'ERREUR : certificat différent de la dernière Release, APK refusée.'; exit 1; }
          fi
          echo "Empreinte de signature stable : $NEW_CERT" >> "$GITHUB_STEP_SUMMARY"
      - name: Publier le fichier APK Release dans Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camera-maison-officiel-${{ github.run_number }}
          path: chk-cameras-release.apk
          if-no-files-found: error
      - name: Créer une Release publique récupérée dans l'application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" chk-cameras-release.apk chk-cameras-release.apk.sha256 \
            --target "$GITHUB_SHA" --title "CHK Caméras $TAG" --latest \
            --notes "Version officielle signée en permanence. Les versions suivantes s'installent depuis CHK Caméras sans supprimer les données, sous réserve d'une mise à jour compatible et de la confirmation Android."
