plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chk.cameras'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chk.cameras'
        minSdk 21
        targetSdk 34
        versionCode = Integer.parseInt(project.findProperty('appVersionCode')?.toString() ?: '1')
        versionName = project.findProperty('appVersionName')?.toString() ?: '1.0.0'
        buildConfigField 'String', 'GITHUB_REPOSITORY', '"' + (project.findProperty('githubRepository') ?: 'Chasmet/Camera-maison') + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            def ks = System.getenv('CHK_KEYSTORE_PATH')
            if (ks != null && !ks.trim().isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv('CHK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHK_KEY_ALIAS')
                keyPassword System.getenv('CHK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CHK_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}

// Lecteur natif RTSP et HLS, sans ouverture d'application externe
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
